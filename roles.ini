# =============================================================================
# Vim-AI 角色配置
#
# 使用方式:
#   :AI /grammar           - 修复语法错误
#   :AI /explain           - 解释代码
#   :AI /refactor          - 重构代码
#   :AI /diff              - 输出 unified diff（配合 :AIDiff）
#   :AIChat /agent         - 开启 tool calling agent 模式
#   :AI /business-email    - 商务邮件风格优化
#
# 可以传递参数:
#   :AI /refactor : rust   - 使用 rust 风格重构
# =============================================================================

# -----------------------------------------------------------------------------
# 代码相关角色
# -----------------------------------------------------------------------------

[explain]
prompt = Explain this code in detail. Cover: what it does, key logic, edge cases, and potential improvements.

[refactor]
prompt =
  You are a Clean Code expert. Please refactor the following code to be more
  clean and concise. Also, briefly explain the refactoring rationale.
options.temperature = 0.4
options-chat.model = gpt-4

[test]
prompt = Write functional unit tests (just give the program without other content)

[review]
prompt = Review this code and suggest improvements

[debug]
prompt = Debug this code and explain the issue and fix

[code-review]
prompt = Act as a code reviewer. Provide constructive feedback on:
  1. Code quality and readability
  2. Potential bugs or issues
  3. Performance concerns
  4. Security considerations
  5. Suggestions for improvement

[api-design]
prompt = Review and suggest improvements for this API design. Consider RESTful best practices.

[sql]
prompt = Review and optimize this SQL query
options.temperature = 0.3

[regex]
prompt = Explain this regular expression and provide examples

[diff]
prompt = Generate a unified diff patch for this code change. Output ONLY the diff, no explanations.

# -----------------------------------------------------------------------------
# 英语写作角色（细粒度）
# -----------------------------------------------------------------------------

[grammar]
prompt = Fix spelling and grammar errors. Return the corrected version only.

[english]
prompt = Improve English expression to sound more natural and native. Return ONLY the improved version, no explanations.
options.temperature = 0.3

[english-tutor]
prompt = Improve English expression and explain it to a Chinese student as an English teacher.

[business-email]
prompt = Rewrite this in a professional business email style. Keep it concise, polite, and action-oriented. Return the revised version only.

[academic]
prompt = Rewrite this in an academic writing style. Use formal structure, precise terminology, and objective tone. Return the revised version only.

[casual]
prompt = Rewrite this in natural, conversational English — as if talking to a friend or colleague. Return the revised version only.

[concise]
prompt = Condense this English text to 50% of its original length while preserving all key meaning. Return the condensed version only.

[business-writing]
prompt = Improve this business writing. Focus on clarity, directness, and professional tone. Cut fluff and jargon. Return the revised version only.

[vocab-boost]
prompt = Improve this English by replacing basic vocabulary with more precise, advanced alternatives while keeping the meaning identical. Return ONLY the improved text, no explanations.
options.temperature = 0.5

# -----------------------------------------------------------------------------
# 中文相关角色
# -----------------------------------------------------------------------------

[chinese]
prompt = 改进这些笔记内容: 保留知识点，形成结构更清晰，表达更完整，专业用语更准确的文章, 给出修改后的直接结果而不用附带其他解释内容。

[translate]
prompt = Translate to English. Just give the translated text without other content.

[summary]
prompt = Summarize the key points concisely in bullet points.

# -----------------------------------------------------------------------------
# 开发辅助角色
# -----------------------------------------------------------------------------

[professional]
prompt = Improve expression to be more professional in software development area.

[commit]
prompt = Generate a git commit message based on the changes. Use conventional commits format (type: description). Keep it under 72 chars.

[pr]
prompt = Generate a pull request description based on the changes. Include: what changed, why, how to test, and screenshots/links if applicable.

[vimcmd]
prompt = You are a Vim expert. Convert natural language editing instructions into Vim ex commands.

The user will describe what edit they want to make to the selected code or current buffer. Your task is to:

1. Understand the editing intent from the natural language description
2. Generate appropriate Vim commands (ex commands like `:s/`, `:d`, `:move`, `:copy`, `:` etc.)
3. For substitutions, use the pattern from the actual selected text
4. Wrap executable commands in double angle brackets like `<<command>>`

Examples:
- "delete all lines containing foo" → `<<:g/foo/d>>
- "replace hello with goodbye" → `<<:s/hello/goodbye/g>>
- "move line 5 to after line 10" → `<<:5m10>>
- "duplicate this block below" → `<<:t.>>
- "change foo to bar on lines 3-7" → `<<:3,7s/foo/bar/g>>

IMPORTANT RULES:
- ONLY output the command(s) in <<>> brackets, nothing else
- Use proper Vim ex command syntax
- Make commands minimal but clear
- If the edit is complex, break it into multiple sequential commands

Your response should ONLY contain the command(s) in <<>> format.
