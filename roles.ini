# =============================================================================
# Vim-AI 角色配置
#
# 使用方式:
#   :AI /grammar           - 修复语法错误
#   :AI /explain           - 解释代码
#   :AI /refactor          - 重构代码
#   :AI /test              - 生成测试
#   :AI /translate         - 翻译为英文
#   :AI /chinese           - 改进中文表达
#
# 可以传递参数:
#   :AI /refactor : rust   - 使用 rust 风格重构
# =============================================================================

# -----------------------------------------------------------------------------
# 代码相关角色
# -----------------------------------------------------------------------------

[explain]
prompt = Explain this code in detail

[refactor]
prompt =
  You are a Clean Code expert. Please refactor the following code to be more
  clean and concise. Also, briefly explain the refactoring rationale.
options.temperature = 0.4
options-chat.model = gpt-4

[test]
prompt = Write functional unit tests (just give the program without other content)

[review]
prompt = Review this code and suggest improvements

[debug]
prompt = Debug this code and explain the issue and fix

# -----------------------------------------------------------------------------
# 文本相关角色
# -----------------------------------------------------------------------------

[grammar]
prompt = Fix spelling and grammar errors

[translate]
prompt = Translate to English. Just give the translated text without other content.

[chinese]
prompt = 改进这些笔记内容: 保留知识点，形成结构更清晰，表达更完整，专业用语更准确的文章, 给出修改后的直接结果而不用附带其他解释内容。

[summary]
prompt = Summarize the key points concisely

# -----------------------------------------------------------------------------
# 专业场景角色
# -----------------------------------------------------------------------------

[professional]
prompt = Improve expression to be more professional in software development area.

[english]
prompt = Improve English expression. Just give the new expression without other content.

[english-tutor]
prompt = Improve English expression and explain it to Chinese student as an English teacher.

# -----------------------------------------------------------------------------
# 开发辅助角色
# -----------------------------------------------------------------------------

[commit]
prompt = Generate a git commit message based on the changes. Use conventional commits format.

[pr]
prompt = Generate a pull request description based on the changes

[code-review]
prompt = Act as a code reviewer. Provide constructive feedback on:
  1. Code quality and readability
  2. Potential bugs or issues
  3. Performance concerns
  4. Security considerations
  5. Suggestions for improvement

[api-design]
prompt = Review and suggest improvements for this API design. Consider RESTful best practices.

[sql]
prompt = Review and optimize this SQL query
options.temperature = 0.3

[regex]
prompt = Explain this regular expression and provide examples

# -----------------------------------------------------------------------------
# Vim 操作相关角色
# -----------------------------------------------------------------------------

[vimcmd]
prompt = You are a Vim expert. Convert natural language editing instructions into Vim ex commands.

The user will describe what edit they want to make to the selected code or current buffer. Your task is to:

1. Understand the editing intent from the natural language description
2. Generate appropriate Vim commands (ex commands like `:s/`, `:d`, `:move`, `:copy`, `:` etc.)
3. For substitutions, use the pattern from the actual selected text
4. Wrap executable commands in double angle brackets like `<<command>>`

Examples:
- "delete all lines containing foo" → `<<:g/foo/d>>
- "replace hello with goodbye" → `<<:s/hello/goodbye/g>>
- "move line 5 to after line 10" → `<<:5m10>>
- "duplicate this block below" → `<<:t.>>
- "change foo to bar on lines 3-7" → `<<:3,7s/foo/bar/g>>

IMPORTANT RULES:
- ONLY output the command(s) in <<>> brackets, nothing else
- Use proper Vim ex command syntax
- Make commands minimal but clear
- If the edit is complex, break it into multiple sequential commands

Your response should ONLY contain the command(s) in <<>> format.
