<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Structure Visualizer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background: #16213e;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #0f3460;
        }
        header h1 {
            font-size: 1.5rem;
            color: #e94560;
        }
        .status {
            padding: 5px 15px;
            background: #0f3460;
            border-radius: 20px;
            font-size: 0.9rem;
        }
        .status.connected {
            background: #00b894;
        }
        .status.disconnected {
            background: #e17055;
        }
        .container {
            flex: 1;
            display: flex;
            padding: 20px;
            gap: 20px;
        }
        .sidebar {
            width: 300px;
            background: #16213e;
            border-radius: 10px;
            padding: 15px;
            overflow-y: auto;
        }
        .sidebar h2 {
            font-size: 1rem;
            margin-bottom: 10px;
            color: #e94560;
        }
        .file-info {
            background: #0f3460;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 10px;
        }
        .file-info .name {
            font-weight: bold;
            color: #00cec9;
        }
        .file-info .path {
            font-size: 0.85rem;
            color: #b2bec3;
            margin-top: 5px;
        }
        .plantuml-source {
            background: #0f3460;
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 0.85rem;
            white-space: pre-wrap;
            overflow-y: auto;
            max-height: 400px;
        }
        .main-view {
            flex: 1;
            background: #16213e;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: auto;
            padding: 20px;
        }
        .svg-container {
            max-width: 100%;
            text-align: center;
        }
        .svg-container svg {
            max-width: 100%;
            height: auto;
        }
        .waiting {
            color: #b2bec3;
            font-size: 1.2rem;
        }
        .controls {
            display: flex;
            gap: 10px;
        }
        button {
            background: #0f3460;
            border: none;
            color: #eee;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        button:hover {
            background: #e94560;
        }
        .zoom-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .zoom-controls input {
            width: 100px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Code Structure Visualizer</h1>
        <div class="status disconnected" id="status">Disconnected</div>
    </header>
    
    <div class="container">
        <div class="sidebar">
            <h2>Current File</h2>
            <div class="file-info" id="file-info">
                <div class="name">Waiting for update...</div>
                <div class="path"></div>
            </div>
            
            <h2>PlantUML Source</h2>
            <div class="plantuml-source" id="puml-source">
                @startuml
                title Waiting for Vim update
                @enduml
            </div>
            
            <div class="controls">
                <button onclick="zoomIn()">Zoom In</button>
                <button onclick="zoomOut()">Zoom Out</button>
                <button onclick="resetZoom()">Reset</button>
            </div>
        </div>
        
        <div class="main-view">
            <div class="svg-container" id="svg-container">
                <div class="waiting">Waiting for code structure from Vim...</div>
            </div>
        </div>
    </div>

    <script>
        let ws = null;
        let currentZoom = 100;

        function connectWebSocket() {
            ws = new WebSocket('ws://localhost:8766');
            
            ws.onopen = () => {
                document.getElementById('status').className = 'status connected';
                document.getElementById('status').textContent = 'Connected';
            };
            
            ws.onclose = () => {
                document.getElementById('status').className = 'status disconnected';
                document.getElementById('status').textContent = 'Disconnected';
                // 重连
                setTimeout(connectWebSocket, 3000);
            };
            
            ws.onerror = (err) => {
                console.error('WebSocket error:', err);
            };
            
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === 'svg' || data.type === 'update') {
                    displaySvg(data.content);
                    if (data.puml) {
                        document.getElementById('puml-source').textContent = data.puml;
                    }
                }
            };
        }

        function displaySvg(svgContent) {
            const container = document.getElementById('svg-container');
            container.innerHTML = svgContent;
            const svg = container.querySelector('svg');
            if (svg) {
                svg.style.width = currentZoom + '%';
                svg.style.height = 'auto';
            }
        }

        function zoomIn() {
            currentZoom = Math.min(currentZoom + 20, 200);
            applyZoom();
        }

        function zoomOut() {
            currentZoom = Math.max(currentZoom - 20, 30);
            applyZoom();
        }

        function resetZoom() {
            currentZoom = 100;
            applyZoom();
        }

        function applyZoom() {
            const svg = document.querySelector('#svg-container svg');
            if (svg) {
                svg.style.width = currentZoom + '%';
            }
        }

        // 启动
        connectWebSocket();
    </script>
</body>
</html>
